    .d4 { animation: led 2s ease-in-out infinite; animation-delay: 1.32s; }
    .d5 { animation: led 2s ease-in-out infinite; animation-delay: 1.65s; }
    @keyframes beat { to { stroke-dashoffset: -260; } } .beat { stroke-dasharray: 130 130; animation: beat 2.6s linear infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
